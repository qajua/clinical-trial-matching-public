paths:
  dataset_path: data/demo/demo_notes.csv
  retrieval_path: outputs/ds_retrieval.csv
  langextract_path: outputs/ds_langextract.csv
  primekg_path: outputs/ds_primekg.csv
  pred_path: outputs/ds_pred.csv
  metric_path: outputs/ds_metric.json
  err_path: outputs/ds_err.csv
  primekg_hints_path: data/demo/demo_primekg.csv

models:
  llm_model_name: gpt-4o-mini
  embedding_model_name: BAAI/bge-small-en-v1.5

generation:
  temperature: 0.0
  max_tokens: 256

dataset:
  max_rows: null
  answer_max_tokens: 64

retrieval:
  chunk_size_tokens: 384
  chunk_overlap_tokens: 64
  bm25_top_k: 5
  dense_top_k: 5
  hybrid_top_k: 5
  hybrid_alpha: 0.5

langextract:
  enabled: true